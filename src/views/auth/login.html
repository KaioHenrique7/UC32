<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - UC32</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="auth-container">

        <div class="card">

            <h1>Entrar</h1>

            <p>Entre na sua conta para continuar.</p>

            <form action="/login" method="POST">

                <label>E-mail</label>
                <input
                    type="email"
                    name="email"
                    required
                >

                <label>Senha</label>
                <input
                    type="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p>
                Ainda não possui conta?
                <a href="/register">
                    Criar conta
                </a>
            </p>

        </div>

    </main>

</body>
</html>
