
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reclamações | UC32</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="layout">

        <aside class="sidebar">
            <h2>UC32</h2>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/complaints">Reclamações</a>
                <a href="/complaints/create">Nova reclamação</a>
                <a href="/logout">Sair</a>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1>Reclamações</h1>
                    <p class="muted">
                        Consulte suas reclamações cadastradas.
                    </p>
                </div>

                <a class="btn" href="/complaints/create">
                    + Nova reclamação
                </a>
            </header>

            <section class="panel">
                <h2>Minhas reclamações</h2>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Categoria</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td colspan="4">
                                    Nenhuma reclamação foi carregada.
                                    <p class="muted">
                                        A integração com o back-end
                                        será necessária para exibir
                                        os dados reais.
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

    </div>
</body>
</html>
