
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Reclamação | UC32</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="layout">

        <aside class="sidebar">
            <h2>UC32</h2>

            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/complaints">Reclamações</a>
                <a href="/complaints/create">Nova reclamação</a>
                <a href="/logout">Sair</a>
            </nav>
        </aside>

        <main class="main">

            <header class="topbar">
                <div>
                    <h1>Nova reclamação</h1>
                    <p class="muted">
                        Preencha os dados para registrar sua reclamação.
                    </p>
                </div>
            </header>

            <section class="panel">
                <h2>Dados da reclamação</h2>

                <form action="/complaints" method="POST">

                    <label for="title">Título</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Digite o título da reclamação"
                        required
                    >

                    <label for="category">Categoria</label>
                    <select id="category" name="category" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="estrutura">Estrutura</option>
                        <option value="limpeza">Limpeza</option>
                        <option value="atendimento">Atendimento</option>
                        <option value="outros">Outros</option>
                    </select>

                    <label for="description">Descrição</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Explique o problema encontrado..."
                        required
                    ></textarea>

                    <div class="form-actions">
                        <button type="submit">
                            Enviar reclamação
                        </button>

                        <a class="btn btn-secondary" href="/complaints">
                            Cancelar
                        </a>
                    </div>

                </form>
            </section>

        </main>
    </div>
</body>
</html>
